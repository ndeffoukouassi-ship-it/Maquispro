name: Construire APK MaquisPro (test)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/apk-test.yml'

jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generer le projet Android
        run: flutter create --platforms=android --org com.igc --project-name maquispro .
      - name: Nom public et autorisation camera
        run: |
          sed -i 's/android:label="maquispro"/android:label="MaquisPro"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml
      - name: Installer les dependances
        run: flutter pub get
      - name: Executer les tests
        run: flutter test
      - name: Compiler APK de test
        run: flutter build apk --debug
      - name: Fournir APK installable
        uses: actions/upload-artifact@v4
        with:
          name: MaquisPro-Android-APK-test
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
