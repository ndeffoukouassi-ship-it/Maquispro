name: Tester isolation Firestore multi-maquis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'package.json'
      - 'tests/firestore.rules.test.mjs'
      - '.github/workflows/firestore-rules-test.yml'

jobs:
  security-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances de tests
        run: npm install --no-audit --no-fund
      - name: Tester les règles avec l'émulateur Firestore
        run: npx firebase emulators:exec --project demo-maquispro --only firestore "npm run test:rules"
