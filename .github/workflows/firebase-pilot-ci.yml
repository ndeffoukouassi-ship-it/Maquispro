name: Vérifier MaquisPro Firebase (pilote)

on:
  push:
    branches: [firebase-multi-maquis]
    paths:
      - 'web-firebase/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'tests/**'
      - '.github/workflows/firebase-pilot-ci.yml'
  workflow_dispatch:

jobs:
  source-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe du serveur
        run: |
          node --check functions/core.cjs
          node --check functions/index.cjs
          node --check web-firebase/src/main.js
      - name: Tester calculs et contraintes de vente
        run: node --test functions/tests/core.test.cjs
      - name: Installer dépendances web
        run: npm install --no-audit --no-fund
        working-directory: web-firebase
      - name: Tester exports Excel Word
        run: node --test tests/catalog-export.test.mjs
      - name: Construire interface web Firebase
        run: npm run build
        working-directory: web-firebase

  firestore-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer dépendances des tests d'isolation
        run: npm install --no-audit --no-fund
      - name: Vérifier séparation des établissements
        run: npx firebase emulators:exec --project demo-maquispro --only firestore "npm run test:rules"
