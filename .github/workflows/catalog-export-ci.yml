name: Vérifier export Excel Word du catalogue MaquisPro

on:
  push:
    branches: [main]
    paths:
      - 'web/catalog-export.mjs'
      - 'web/index.html'
      - 'web/app.js'
      - 'web/styles.css'
      - 'tests/catalog-export.test.mjs'
      - '.github/workflows/catalog-export-ci.yml'
  workflow_dispatch:

jobs:
  catalogue-files:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier syntaxe JavaScript
        run: |
          node --check web/catalog-export.mjs
          node --check web/app.js
      - name: Tester fichiers Excel XLSX et Word DOCX
        run: node --test tests/catalog-export.test.mjs
      - name: Vérifier structure ZIP avec Python
        run: |
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; import {createCatalogueFile} from './web/catalog-export.mjs'; for (const f of ['xlsx','docx']) { const v=createCatalogueFile([{name:'Castel 65 cl',buy:550,sell:650}],'MaquisPro',f); writeFileSync('/tmp/maquispro.'+f,Buffer.from(await v.arrayBuffer()));}"
          python -c "import zipfile; [print(f, zipfile.ZipFile('/tmp/maquispro.'+f).testzip()) for f in ['xlsx','docx']]"
